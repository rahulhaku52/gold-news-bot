name: Gold AI Bot v3 - 22-Layer Engine

on:
  schedule:
    # 02:30 UTC corresponds to 08:00 AM IST (Daily Market Report)
    - cron: '30 2 * * *'
    # Regular 15-minute background scans
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run (scan, daily-report, test-telegram)'
        required: true
        default: 'scan'
        type: choice
        options:
          - scan
          - daily-report
          - test-telegram

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Report (at 02:30 UTC / 08:00 AM IST)
        if: github.event.schedule == '30 2 * * *' || inputs.action == 'daily-report'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python main.py --daily-report

      - name: Execute 22-Layer Market Scan
        if: github.event.schedule == '*/15 * * * *' || inputs.action == 'scan' || inputs.action == ''
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python main.py --scan

      - name: Execute Test Telegram
        if: inputs.action == 'test-telegram'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py --test-telegram

      - name: Commit and Push Database & Log Updates (Daily or New Signal)
        if: github.event.schedule == '30 2 * * *' || inputs.action == 'daily-report'
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add database/posted_articles.json database/signals.db || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-backup signal database & logs [skip ci]" && git push)
